<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffdf8"><title>More Than Small Talk</title>
<style>
:root{--ink:#28263a;--muted:#797789;--stroke:#eae5e8;--background:#fffdf8;--purple:#7660a9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 7% 5%,#fff0cb 0,transparent 30%),radial-gradient(circle at 100% 60%,#eee3ff 0,transparent 32%),var(--background);font-family:ui-rounded,'Trebuchet MS',system-ui,-apple-system,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a58ff0;outline-offset:3px}.shell{max-width:1060px;margin:0 auto;padding:55px 24px 80px}h1{font-size:clamp(42px,6.8vw,77px);letter-spacing:-.065em;line-height:1.02;margin:0 0 38px;font-weight:850}h1 span{color:#e6a649}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}.level{background:#fff;border:2px solid #ede9ed;text-align:left;border-radius:23px;padding:22px;min-height:122px;color:var(--ink);transition:transform .15s,border-color .15s}.level:hover{transform:translateY(-2px)}.level.active{border-color:var(--accent);background:var(--wash);box-shadow:0 8px 22px #39324a0c}.label{display:block;font-size:12px;font-weight:850;letter-spacing:.13em;color:#726b7c;margin-bottom:12px}.level strong{font-size:clamp(19px,2.6vw,27px);letter-spacing:-.035em}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:20px;align-items:stretch}.question-section,.players-section{background:#fff;border:1px solid var(--stroke);border-radius:25px;padding:21px;box-shadow:0 12px 40px #57495b0b}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:14px;font-size:13px;font-weight:800;color:#746d7e}.question{min-height:315px;background:var(--wash);border-radius:19px;padding:31px 30px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}.question .number{color:var(--tint);font-size:13px;font-weight:900;letter-spacing:.12em}.question .questiontext{font-weight:800;font-size:clamp(25px,3.3vw,39px);line-height:1.22;letter-spacing:-.045em;overflow-wrap:anywhere}.row{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}.btn{border:1.5px solid #ddd7e6;border-radius:13px;background:#fff;color:var(--ink);padding:13px 18px;font-weight:800}.btn.primary{background:#7259a7;color:#fff;border-color:#7259a7}.btn:disabled{opacity:.4;cursor:not-allowed}.grow{flex:1}h2{font-size:21px;letter-spacing:-.04em;margin:1px 0 17px}.inputrow{display:flex;gap:8px}.inputrow input{min-width:0;width:100%;padding:13px;border:1.5px solid #ded8e5;border-radius:13px;background:#fff;color:var(--ink)}.inputrow .btn{padding:13px 17px}.names{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.namechip{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;background:#f4f0fb;border-radius:999px;font-size:13px;font-weight:700}.namechip button{border:0;background:transparent;color:#7c7195;font-size:17px;line-height:1;padding:0 2px}.drawbox{background:#f7f4fc;border:1.5px dashed #d7ccec;border-radius:18px;min-height:140px;margin-top:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.winner{font-size:clamp(27px,3.4vw,39px);font-weight:900;color:#6f4caa;overflow-wrap:anywhere}.placeholder{color:#8b8398;font-weight:650;font-size:15px}.remaining{color:#766f83;font-size:12px;margin-top:12px;min-height:20px}.hint{font-size:12px;color:#918998;margin-top:10px}.empty{font-size:13px;color:#9a93a1;margin:12px 0}.foot{margin-top:20px;text-align:right}.foot button{background:none;border:0;color:#817889;font-size:12px;text-decoration:underline;padding:7px}.level:nth-child(1){--accent:#edae52;--wash:#fff5dd}.level:nth-child(2){--accent:#77c6a3;--wash:#e8f8ed}.level:nth-child(3){--accent:#ac91d5;--wash:#f1eafd}@media(max-width:740px){.shell{padding:29px 15px 45px}.layout{grid-template-columns:1fr}.levels{gap:8px}.level{padding:15px 12px;min-height:107px;border-radius:16px}.label{font-size:10px}.level strong{font-size:17px}.question{min-height:275px;padding:25px 21px}.question-section,.players-section{padding:14px;border-radius:19px}h1{margin-bottom:25px}}@media(max-width:400px){.level strong{font-size:15px}.level{padding:12px 9px}.question .questiontext{font-size:26px}}
</style></head><body><div class="shell"><h1>More than small talk<span>.</span></h1>
<nav class="levels" aria-label="Levels"><button class="level active" data-level="0"><span class="label">LEVEL 01</span><strong>1PM Thoughts</strong></button><button class="level" data-level="1"><span class="label">LEVEL 02</span><strong>2200 Thoughts</strong></button><button class="level" data-level="2"><span class="label">LEVEL 03</span><strong>3AM Thoughts</strong></button></nav>
<main class="layout"><section class="question-section"><div class="sectionhead"><span id="deckLabel">1PM Thoughts</span><span id="count">10 left</span></div><div class="question" id="question"><span class="number" id="cardNumber">LEVEL 01</span><div class="questiontext" id="questionText">Draw a question to begin.</div></div><div class="row"><button class="btn primary grow" id="nextQuestion">Draw a question ↗</button><button class="btn" id="previous" disabled>← Previous</button></div></section>
<section class="players-section"><h2>Who's sharing?</h2><form class="inputrow" id="nameForm"><input id="nameInput" placeholder="Enter a name" autocomplete="off" maxlength="35" aria-label="Player name"><button class="btn" type="submit">Add +</button></form><div class="names" id="names"></div><div class="drawbox" aria-live="polite"><div class="placeholder" id="chosenName">Draw a name!</div></div><button class="btn primary" id="drawName" style="width:100%;margin-top:12px">Draw a name ↗</button><div class="remaining" id="remainingNames"></div><button class="btn" id="resetNames" style="width:100%;margin-top:8px">Reset names</button></section></main><div class="foot"><button id="resetQuestions">Reset questions</button></div></div>
<script>
const levels=[
{name:'1PM Thoughts',icon:'☀',colors:['#f5dbb1','#eec58f','#46301b'],questions:[
"What's a hidden skill or talent you have that most people don't know about?",
"What's the most spontaneous thing you've ever done?",
"If you could relive one day of your life, which would it be and why?",
"If your friends had to describe you in three words, what would they say?",
"What's a small thing that instantly makes your day better?",
"What's the most unexpected thing that happened to you this year?",
"What's something you used to dislike but have grown to love?",
"If money and expectations weren't an issue, what would you be doing with your life?",
"What's one thing you think is overrated that everyone else seems to love?",
"What's something on your bucket list that you haven't gotten around to doing?" ]},
{name:'2200 Thoughts',icon:'☾',colors:['#c9ecd8','#94d9bc','#214b3b'],questions:[
"What's something that's been on your mind a lot lately?",
"What's a moment during university when you realised you've grown as a person?",
"What's a difficult experience that shaped who you are today?",
"Have you ever gone through something that seemed bad at first but eventually led to something good?",
"What's one thing you used to worry about that doesn't bother you as much anymore?",
"Have you ever received exactly the encouragement you needed at just the right time?",
"What's a moment when you felt genuinely loved, supported, or accepted?",
"Have you ever experienced a moment of unexpected peace in the middle of a stressful situation?",
"What's something you had to let go of in order to grow?",
"What's a situation that changed the way you see yourself?" ]},
{name:'3AM Thoughts',icon:'✧',colors:['#ded2ff','#bba8ec','#352452'],questions:[
"How do you usually navigate uncertainty when you don't know what comes next?",
"What gives your life meaning, especially during difficult seasons?",
"What does peace mean to you, and when was the last time you genuinely felt it?",
"What's something you're still trying to figure out about yourself?",
"What does success mean to you, and has your definition changed over time?",
"If you could remove one fear from your life, what would it be?",
"Have you ever questioned something you strongly believed in? What happened?",
"If you could know exactly what your future holds, would you want to?",
"Have you ever experienced something that made you wonder whether there's more to life than what we can see?",
"Have you ever experienced a time when things were completely out of your control? How did you get through it?" ]}
];

const $=id=>document.getElementById(id);
const shuffle=(a)=>{const v=[...a];for(let i=v.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]]}return v};
let current=0;
let decks=levels.map(l=>shuffle(l.questions.map((_,i)=>i)));
let history=levels.map(()=>[]);
let names=[],pool=[],chosen='';
function refreshQuestion(){const l=levels[current],last=history[current].at(-1);$('deckLabel').textContent=l.name;$('count').textContent=decks[current].length+' left';$('cardNumber').textContent='LEVEL 0'+(current+1);$('questionText').textContent=last===undefined?'Draw a question to begin.':l.questions[last];$('previous').disabled=history[current].length<2;const washes=['#fff3d6','#e8f8ee','#efe6fa'],tints=['#ac7125','#397e60','#7753a4'];$('question').style.setProperty('--wash',washes[current]);$('question').style.setProperty('--tint',tints[current]);$('nextQuestion').textContent=decks[current].length?'Draw a question ↗':'Reshuffle questions ↻'}
function setLevel(i){current=i;document.querySelectorAll('.level').forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',String(i===j))});refreshQuestion()}
function drawQuestion(){if(!decks[current].length){decks[current]=shuffle(levels[current].questions.map((_,i)=>i));history[current]=[]}history[current].push(decks[current].pop());refreshQuestion()}
function previousQuestion(){if(history[current].length<2)return;decks[current].push(history[current].pop());refreshQuestion()}
function refreshNames(){const wrap=$('names');wrap.replaceChildren();names.forEach(n=>{const c=document.createElement('span');c.className='namechip';const t=document.createElement('span');t.textContent=n;const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Remove '+n);b.textContent='×';b.onclick=()=>{names=names.filter(x=>x!==n);pool=pool.filter(x=>x!==n);if(chosen===n){chosen='';$('chosenName').textContent='Draw a name!';$('chosenName').className='placeholder'}refreshNames()};c.append(t,b);wrap.append(c)});$('drawName').disabled=!names.length;$('remainingNames').textContent=names.length?(pool.length?pool.length+' name'+(pool.length===1?'':'s')+' remaining':chosen?'Everyone has had a turn! Next draw starts a new round.':names.length+' names ready'):''}
$('nameForm').addEventListener('submit',e=>{e.preventDefault();const n=$('nameInput').value.trim().replace(/\s+/g,' ');if(!n)return;if(names.some(x=>x.toLocaleLowerCase()===n.toLocaleLowerCase())){$('nameInput').select();return}names.push(n);if(pool.length||!chosen)pool.push(n);$('nameInput').value='';refreshNames()});
$('drawName').onclick=()=>{if(!names.length)return;if(!pool.length)pool=shuffle(names);const j=Math.floor(Math.random()*pool.length);chosen=pool.splice(j,1)[0];$('chosenName').textContent=chosen;$('chosenName').className='winner';refreshNames()};
$('resetNames').onclick=()=>{pool=shuffle(names);chosen='';$('chosenName').textContent='Draw a name!';$('chosenName').className='placeholder';refreshNames()};
$('resetQuestions').onclick=()=>{if(!confirm('Reset all question decks?'))return;decks=levels.map(l=>shuffle(l.questions.map((_,i)=>i)));history=levels.map(()=>[]);setLevel(0)};
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>setLevel(Number(b.dataset.level)));
$('nextQuestion').onclick=drawQuestion;$('previous').onclick=previousQuestion;
setLevel(0);refreshNames();
</script></body></html>
